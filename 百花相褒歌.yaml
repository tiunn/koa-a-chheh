      POJ: Tē-it kái khǹg pêng-iú ko
      original: 第一改勸朋友哥
      modify01: 第一改勸朋友哥
  2:
    unkha: un
    1:
      POJ: Ū-lâng liām koa chin gâu pûn
      original: 有人念歌真肴噴
      modify01: 有人唸歌真𠢕歕

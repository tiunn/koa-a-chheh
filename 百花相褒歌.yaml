lyrics:
  1:
    unkha: o
    1:
      POJ: Koa-á hó pháiⁿ chāi-lâng chò
      original: 歌仔好呆在人作
      modify01: 歌仔好歹在人作
    2:
      POJ: Góa liām ê koa khǹg lâng hó
      original: 我念兮歌勸人好
      modify01: 我唸的歌勸人好
    3:
      POJ: Lia̍t-ūi m̄-sìn thiaⁿ góa pò
